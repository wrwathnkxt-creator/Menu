<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartKitchen — สั่งอาหาร</title>
  <meta name="description" content="เลือกเมนูอาหารและเครื่องดื่ม สั่งออนไลน์ได้ทันที">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ── Search & Filter ─── */
    .search-bar { position: relative; }
    .search-bar .material-symbols-outlined { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-outline); font-size: 1.1rem; }
    .search-input { height: 44px; padding: 0 var(--space-4) 0 40px; }
    .category-scroll { display: flex; gap: var(--space-2); overflow-x: auto; padding-bottom: var(--space-2); }
    .category-chip { flex-shrink: 0; padding: 6px 14px; border-radius: var(--radius-full); border: 1.5px solid var(--color-outline-var); background: white; font-size: 0.82rem; font-weight: 500; cursor: pointer; transition: all 0.15s ease; white-space: nowrap; }
    .category-chip.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
    /* ── Menu Grid ─── */
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
    .menu-card { position: relative; }
    .menu-card-img { height: 130px; overflow: hidden; }
    .menu-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
    .menu-card:hover .menu-card-img img { transform: scale(1.04); }
    .menu-card-body { padding: var(--space-3); }
    .menu-card-name { font-weight: 600; font-size: 0.85rem; line-height: 1.3; }
    .menu-card-price { font-size: 0.95rem; font-weight: 700; color: var(--color-primary); margin-top: 4px; }
    .menu-card-stock { font-size: 0.7rem; color: var(--color-on-surface-var); font-family: var(--font-mono); }
    .add-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--gradient-ai); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 2px 8px rgba(0,72,141,0.3); transition: transform 0.15s ease; }
    .add-btn:active { transform: scale(0.9); }
    .menu-card-footer { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-3) var(--space-3); }
    /* ── Cart Panel ─── */
    .cart-panel { background: white; border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: var(--space-5); border-top: 1px solid var(--color-outline-var); }
    .cart-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--color-surface-mid); }
    .cart-item-name { flex: 1; font-size: 0.85rem; font-weight: 500; }
    .qty-ctrl { display: flex; align-items: center; gap: var(--space-2); }
    .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--color-outline-var); background: white; cursor: pointer; font-size: 1rem; font-weight: 600; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .qty-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .qty-num { font-weight: 700; font-size: 0.9rem; min-width: 20px; text-align: center; }
    .cart-item-price { font-weight: 600; font-size: 0.85rem; color: var(--color-primary); min-width: 60px; text-align: right; }
    /* ── Summary ─── */
    .summary-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: var(--space-2); }
    .summary-total { font-size: 1.1rem; font-weight: 700; color: var(--color-primary); }
    /* ── Delivery Slider ─── */
    .distance-display { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 700; color: var(--color-primary); }
    /* ── Sections ─── */
    .section { padding: var(--space-4) var(--space-4) 0; }
    .section-title { font-weight: 700; font-size: 1rem; margin-bottom: var(--space-3); }
    /* ── Empty State ─── */
    .empty-state { text-align: center; padding: var(--space-8) var(--space-4); color: var(--color-on-surface-var); }
    .empty-state .material-symbols-outlined { font-size: 3rem; margin-bottom: var(--space-3); display: block; opacity: 0.4; }
    /* ── Bottom FAB for Cart ─── */
    .cart-fab { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--gradient-ai); color: white; border: none; border-radius: var(--radius-full); padding: 14px 28px; font-family: var(--font-body); font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: var(--space-3); box-shadow: 0 6px 20px rgba(0,72,141,0.4); transition: all 0.2s ease; white-space: nowrap; }
    .cart-fab:hover { box-shadow: 0 8px 28px rgba(0,72,141,0.5); }
    .cart-fab.hidden { display: none; }
    .cart-badge { background: white; color: var(--color-primary); border-radius: 50%; width: 22px; height: 22px; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body class="mb-nav">

  <!-- AppBar -->
  <header class="appbar">
    <div class="appbar-logo">
      <span class="material-symbols-outlined appbar-logo-icon" style="font-variation-settings:'FILL' 1">restaurant</span>
      <span class="appbar-title">SmartKitchen</span>
    </div>
    <div class="appbar-actions">
      <button class="btn-icon" id="logout-btn" title="ออกจากระบบ">
        <span class="material-symbols-outlined">logout</span>
      </button>
    </div>
  </header>

  <!-- Search -->
  <div class="section">
    <div class="search-bar">
      <span class="material-symbols-outlined">search</span>
      <input class="form-input search-input w-full" type="text" id="search-input" placeholder="ค้นหาเมนูอาหาร…">
    </div>
  </div>

  <!-- Category Tabs -->
  <div class="section mt-2">
    <div class="category-scroll hide-scrollbar">
      <div class="category-chip active" data-cat="ทั้งหมด">ทั้งหมด</div>
      <div class="category-chip" data-cat="จานหลัก">🍛 จานหลัก</div>
      <div class="category-chip" data-cat="เครื่องดื่ม">🧋 เครื่องดื่ม</div>
      <div class="category-chip" data-cat="ของทานเล่น">🍟 ของทานเล่น</div>
    </div>
  </div>

  <!-- Menu Grid -->
  <div class="section mt-4">
    <div id="menu-grid" class="menu-grid"></div>
    <div id="menu-loading" class="grid-2">
      <div class="card"><div class="skeleton" style="height:130px"></div><div class="card-body"><div class="skeleton" style="height:14px;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:60%"></div></div></div>
      <div class="card"><div class="skeleton" style="height:130px"></div><div class="card-body"><div class="skeleton" style="height:14px;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:60%"></div></div></div>
    </div>
  </div>

  <!-- Cart FAB -->
  <button class="cart-fab hidden" id="cart-fab" onclick="openCart()">
    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">shopping_cart</span>
    <span id="cart-fab-text">ดูตะกร้า</span>
    <span class="cart-badge" id="cart-fab-badge">0</span>
  </button>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="bottom-nav-item active">
      <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">restaurant_menu</span>
      <span>เมนู</span>
    </div>
    <div class="bottom-nav-item" onclick="openCart()">
      <span class="material-symbols-outlined">shopping_cart</span>
      <span>ตะกร้า</span>
    </div>
  </nav>

  <!-- Cart Bottom Sheet -->
  <div class="overlay" id="cart-overlay" onclick="handleOverlayClick(event)">
    <div class="bottom-sheet" id="cart-sheet">
      <div class="flex items-center justify-between" style="margin-bottom:var(--space-4)">
        <h2 class="text-title-lg">🛒 ตะกร้าสินค้า</h2>
        <button class="btn-icon" onclick="closeCart()"><span class="material-symbols-outlined">close</span></button>
      </div>

      <div id="cart-items-list"></div>

      <div id="cart-checkout-section" class="hidden">
        <!-- Delivery Distance -->
        <div style="margin-top:var(--space-4)">
          <div class="flex items-center justify-between" style="margin-bottom:var(--space-2)">
            <span class="text-sm font-bold">ระยะทางจัดส่ง</span>
            <span class="distance-display" id="distance-display">3 กม.</span>
          </div>
          <input type="range" id="distance-slider" min="1" max="15" value="3" oninput="updateDelivery(this.value)">
          <div class="flex items-center justify-between mt-2 text-sm text-muted">
            <span>1 กม.</span><span>3 กม. แรกฟรี (+10฿/กม.)</span><span>15 กม.</span>
          </div>
        </div>

        <!-- Promo Code -->
        <div style="margin-top:var(--space-4)">
          <div class="flex gap-2">
            <input class="form-input" type="text" id="promo-input" placeholder="โค้ดส่วนลด (NEWFOOD10, EATGOOD20)" style="flex:1;text-transform:uppercase">
            <button class="btn btn-secondary btn-sm" onclick="applyPromo()">ใช้โค้ด</button>
          </div>
          <div id="promo-msg" class="text-sm mt-2" style="display:none"></div>
        </div>

        <!-- Summary -->
        <div style="margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--color-outline-var)">
          <div class="summary-row"><span>ราคาอาหาร</span><span id="subtotal-display">0 ฿</span></div>
          <div class="summary-row"><span>ค่าจัดส่ง</span><span id="delivery-display">0 ฿</span></div>
          <div class="summary-row" id="discount-row" style="display:none;color:var(--status-served)"><span>ส่วนลด</span><span id="discount-display">-0 ฿</span></div>
          <div class="summary-row" style="margin-top:var(--space-3)"><span class="font-bold">รวมสุทธิ</span><span class="summary-total" id="total-display">0 ฿</span></div>
        </div>

        <!-- Contact Form -->
        <div style="margin-top:var(--space-4)">
          <div class="form-group" style="margin-bottom:var(--space-3)">
            <label class="form-label">ชื่อผู้สั่ง</label>
            <input class="form-input" type="text" id="customer-name" placeholder="กรอกชื่อ-นามสกุล">
          </div>
          <div class="form-group" style="margin-bottom:var(--space-3)">
            <label class="form-label">เบอร์โทรศัพท์ (10 หลัก)</label>
            <input class="form-input" type="tel" id="customer-phone" placeholder="0812345678" maxlength="10">
          </div>
          <div class="form-group">
            <label class="form-label">ที่อยู่จัดส่ง หรือ หมายเลขโต๊ะ</label>
            <input class="form-input" type="text" id="customer-address" placeholder="เช่น โต๊ะ 5 หรือ บ้านเลขที่ 123">
          </div>
        </div>

        <button class="btn btn-primary btn-full" style="margin-top:var(--space-5)" id="checkout-btn" onclick="checkout()">
          <span class="material-symbols-outlined" style="font-size:1.1rem">send</span>
          ส่งคำสั่งซื้อ
        </button>
      </div>

      <div id="cart-empty-msg" class="empty-state">
        <span class="material-symbols-outlined">shopping_cart</span>
        <p>ตะกร้าของคุณว่างเปล่า<br>เลือกเมนูที่ชอบได้เลย!</p>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // ── State ──────────────────────────────────────────────
    let allMenu      = [];
    let cart         = {};
    let deliveryFee  = 0;
    let discount     = 0;
    let promoApplied = '';
    let activeCategory = 'ทั้งหมด';

    // ── Init ───────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', async () => {
      Auth.requireRole('customer');
      document.getElementById('logout-btn').onclick = () => Auth.logout();
      await loadMenu();
      setupSearch();
      setupCategories();
    });

    async function loadMenu() {
      const cached = sessionStorage.getItem('sk_menu');
      const ts     = sessionStorage.getItem('sk_menu_ts');
      if (cached && ts && Date.now() - Number(ts) < CONFIG.MENU_CACHE_DURATION) {
        allMenu = JSON.parse(cached);
        renderMenu(allMenu);
        document.getElementById('menu-loading').style.display = 'none';
        return;
      }
      const res = await API.getMenu();
      document.getElementById('menu-loading').style.display = 'none';
      if (res.success) {
        allMenu = res.data;
        sessionStorage.setItem('sk_menu', JSON.stringify(allMenu));
        sessionStorage.setItem('sk_menu_ts', Date.now());
        renderMenu(allMenu);
      } else {
        document.getElementById('menu-grid').innerHTML = '<p class="text-muted text-sm">โหลดเมนูไม่สำเร็จ กรุณาลองใหม่</p>';
      }
    }

    function renderMenu(items) {
      const grid  = document.getElementById('menu-grid');
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = items.filter(m =>
        m.available && m.stock > 0 &&
        (activeCategory === 'ทั้งหมด' || m.category === activeCategory) &&
        (!query || m.name.toLowerCase().includes(query))
      );
      if (!filtered.length) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><span class="material-symbols-outlined">no_food</span><p>ไม่พบเมนูที่ค้นหา</p></div>';
        return;
      }
      grid.innerHTML = filtered.map(m => `
        <div class="card menu-card animate-fade-up" onclick="addToCart('${m.id}')">
          <div class="menu-card-img">
            <img src="${m.image_url}" alt="${m.name}" loading="lazy" onerror="this.src='../assets/placeholder.svg'">
          </div>
          <div class="menu-card-body">
            <div class="menu-card-name">${m.name}</div>
            <div class="flex items-center justify-between mt-2">
              <div>
                <div class="menu-card-price">${m.price.toLocaleString()} ฿</div>
                <div class="menu-card-stock">เหลือ ${m.stock}</div>
              </div>
              <button class="add-btn" onclick="event.stopPropagation();addToCart('${m.id}')">
                <span class="material-symbols-outlined" style="font-size:1.1rem;font-variation-settings:'FILL' 1">add</span>
              </button>
            </div>
          </div>
        </div>`).join('');
    }

    function setupSearch() {
      let timeout;
      document.getElementById('search-input').addEventListener('input', () => {
        clearTimeout(timeout);
        timeout = setTimeout(() => renderMenu(allMenu), 300);
      });
    }

    function setupCategories() {
      document.querySelectorAll('.category-chip').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
          el.classList.add('active');
          activeCategory = el.dataset.cat;
          renderMenu(allMenu);
        });
      });
    }

    // ── Cart ───────────────────────────────────────────────
    function addToCart(menuId) {
      const item = allMenu.find(m => m.id === menuId);
      if (!item) return;
      cart[menuId] = cart[menuId] ? { ...cart[menuId], qty: cart[menuId].qty + 1 } : { ...item, qty: 1 };
      updateCartFAB();
      showToast(`เพิ่ม "${item.name}" ลงตะกร้าแล้ว`);
    }

    function updateCartFAB() {
      const total = Object.values(cart).reduce((s, i) => s + i.qty, 0);
      const fab   = document.getElementById('cart-fab');
      document.getElementById('cart-fab-badge').textContent = total;
      fab.classList.toggle('hidden', total === 0);
    }

    function openCart() {
      renderCartItems();
      document.getElementById('cart-overlay').classList.add('show');
    }
    function closeCart() { document.getElementById('cart-overlay').classList.remove('show'); }
    function handleOverlayClick(e) { if (e.target === document.getElementById('cart-overlay')) closeCart(); }

    function renderCartItems() {
      const items  = Object.values(cart);
      const listEl = document.getElementById('cart-items-list');
      const checkEl= document.getElementById('cart-checkout-section');
      const emptyEl= document.getElementById('cart-empty-msg');

      if (!items.length) {
        listEl.innerHTML = '';
        checkEl.classList.add('hidden');
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');
      checkEl.classList.remove('hidden');
      listEl.innerHTML = items.map(i => `
        <div class="cart-item">
          <div class="cart-item-name">${i.name}</div>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty('${i.id}',-1)">−</button>
            <span class="qty-num">${i.qty}</span>
            <button class="qty-btn" onclick="changeQty('${i.id}',1)">+</button>
          </div>
          <div class="cart-item-price">${(i.price * i.qty).toLocaleString()} ฿</div>
        </div>`).join('');
      updateSummary();
    }

    function changeQty(menuId, delta) {
      if (!cart[menuId]) return;
      cart[menuId].qty += delta;
      if (cart[menuId].qty <= 0) delete cart[menuId];
      updateCartFAB();
      renderCartItems();
    }

    function updateDelivery(km) {
      document.getElementById('distance-display').textContent = km + ' กม.';
      deliveryFee = km <= CONFIG.FREE_DELIVERY_KM ? 0 : (km - CONFIG.FREE_DELIVERY_KM) * CONFIG.DELIVERY_RATE_PER_KM;
      updateSummary();
    }

    async function applyPromo() {
      const code = document.getElementById('promo-input').value.trim().toUpperCase();
      const msgEl= document.getElementById('promo-msg');
      if (!code) return;
      const res = await API.validatePromo(code);
      if (res.success) {
        discount     = res.data.discount;
        promoApplied = code;
        msgEl.style.display  = 'block';
        msgEl.style.color    = 'var(--status-served)';
        msgEl.textContent    = `✅ ใช้โค้ด ${code} ลด ${discount} บาท`;
      } else {
        discount = 0; promoApplied = '';
        msgEl.style.display  = 'block';
        msgEl.style.color    = 'var(--color-error)';
        msgEl.textContent    = `❌ ${res.error?.message}`;
      }
      updateSummary();
    }

    function updateSummary() {
      const subtotal = Object.values(cart).reduce((s, i) => s + i.price * i.qty, 0);
      const total    = Math.max(0, subtotal + deliveryFee - discount);
      document.getElementById('subtotal-display').textContent  = subtotal.toLocaleString() + ' ฿';
      document.getElementById('delivery-display').textContent  = deliveryFee.toLocaleString() + ' ฿';
      document.getElementById('total-display').textContent     = total.toLocaleString() + ' ฿';
      const discRow = document.getElementById('discount-row');
      if (discount > 0) {
        discRow.style.display = 'flex';
        document.getElementById('discount-display').textContent = '-' + discount + ' ฿';
      } else discRow.style.display = 'none';
    }

    async function checkout() {
      const name    = document.getElementById('customer-name').value.trim();
      const phone   = document.getElementById('customer-phone').value.trim();
      const address = document.getElementById('customer-address').value.trim();
      const items   = Object.values(cart);

      if (!name)    { showToast('กรุณาระบุชื่อผู้สั่ง'); return; }
      if (!/^\d{10}$/.test(phone)) { showToast('เบอร์โทรต้องเป็นตัวเลข 10 หลัก'); return; }
      if (!address) { showToast('กรุณาระบุที่อยู่หรือหมายเลขโต๊ะ'); return; }
      if (!items.length) { showToast('กรุณาเลือกอาหารอย่างน้อย 1 รายการ'); return; }

      const subtotal    = items.reduce((s, i) => s + i.price * i.qty, 0);
      const total       = Math.max(0, subtotal + deliveryFee - discount);
      const km          = document.getElementById('distance-slider').value;
      const btn         = document.getElementById('checkout-btn');
      btn.textContent   = 'กำลังส่งคำสั่งซื้อ…';
      btn.disabled      = true;

      const res = await API.createOrder({ customer_name: name, phone, address, items, subtotal, delivery_fee: deliveryFee, discount, total, distance: Number(km) });

      if (res.success) {
        cart = {}; discount = 0; deliveryFee = 0; promoApplied = '';
        sessionStorage.removeItem('sk_menu'); // force reload menu (stock updated)
        updateCartFAB();
        closeCart();
        showToast(`✅ สั่งซื้อสำเร็จ! หมายเลขออเดอร์: ${res.data.order_id}`);
        setTimeout(() => loadMenu(), 1500);
      } else {
        showToast('❌ ' + (res.error?.message || 'ส่งคำสั่งซื้อล้มเหลว'));
        btn.textContent = 'ส่งคำสั่งซื้อ';
        btn.disabled    = false;
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg; el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
